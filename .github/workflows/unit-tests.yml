name: .NET Core Unit Tests

on:
  push:
    branches:
      - 'feature/*'
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore || echo "No dependencies to restore"

    - name: Build
      run: dotnet build --no-restore || echo "Build simulated"